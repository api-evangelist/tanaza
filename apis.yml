aid: tanaza
name: Tanaza
description: >-
  Tanaza is a hardware-agnostic, cloud-based Wi-Fi management platform,
  headquartered in Milan, Italy, that lets managed service providers, system
  integrators, and businesses configure, monitor, and operate Wi-Fi access
  points, SSIDs, and networks from a single dashboard. Alongside its cloud
  management platform, Tanaza operates Classic Hotspot, a guest-Wi-Fi /
  captive-portal product with social login, paid Wi-Fi vouchers, splash-page
  editing, and analytics. Tanaza exposes three API families — a Network
  Management API, a Network Monitoring API, and an Application API — that give
  developers programmatic access to the Tanaza Cloud dashboard data set
  (networks, access points, MAC addresses, active SSIDs, connected clients, and
  signal strength in dBm), plus a Push Contact Notifications webhook feature that
  delivers event notifications to a customer-hosted endpoint over HTTP POST.
